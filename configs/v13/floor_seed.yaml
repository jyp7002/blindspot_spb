# v13.E CONDITIONAL, EXPLORATORY, NO VERDICT. Runs only if SEED (<=9B) is
# NON-INFERIOR and FLOOR is FLOOR MOVES; `bash run.sh v13-floor-seed` refuses
# otherwise (reads results/v13/verdicts.json). C-seed at 0.1% under alpha*.

panel: v13floorseed
kind: opsel
out_panel: v13floorseed
base_on: v13floor
phase: full
density: 0.01
scale_mode: ref_tensor
alphas: [2, 4, 8, 16]
seeds: [0, 1, 2]
mmlu_n: 200
sparsities: [0.999]
extra_variants: [C-seed@0.001]
adaptive_variants: [s0.999, C-seed@0.001]
alpha_ladder: [1, 2, 4, 8, 16, 32, 64, 128, 256, 512, 1024, 2048, 4096]
refine_steps: 3
calib_n: 200
mmlu1k_variants: []
mmlu1k_all_alphas: false
patch_variants: [s0.999, C-seed@0.001]
