# v11 BIG — the 32B/70B tier. RUNS ELSEWHERE, not on the analysis box.
#
# WHAT THIS FIXES. Every "two model tiers" statement in the paper spans
# 2.6B-3.8B and 7-9B. That is a 3x span, and the structural claim is offered as
# a property of behavioural edits in general. A 32B cell makes it a 12x span; a
# 70B cell makes it 27x. If the decomposition holds there, the concentration
# result stops being a small-model result.
#
# WHY IT IS A SEPARATE CONFIG. The analysis box is one L40S (46 GB) and cannot
# hold these in bf16 for TRAINING. colab_t2t4.load_model already knows the
# tier split (bf16 <=32B, 8-bit >=60B) and the T4 arm has run 27B/32B/70B/72B
# for skew profiling -- but INFERENCE ONLY. Nothing here has ever trained a
# contrast vector above 8B.
#
# ---------------------------------------------------------------------------
# READ BEFORE RENTING A NODE. Two things are known-unresolved, and both cost
# money to discover late:
#
# 1. EVERY CELL HERE IS bf16. 8-bit was considered and rejected: this whole
#    experiment measures what survives quantizing the EDIT, so quantizing the
#    BASE underneath it would confound edit structure with base-weight
#    precision at exactly the cell meant to extend the size range. Every
#    published panel is bf16 (colab_t2t4.DTYPE) and the big tier stays
#    comparable to them. (8-bit + LoRA training is also untested here --
#    train_task_vector never calls prepare_model_for_kbit_training -- so the
#    rejected option was not free either.)
#    The cost of that choice is VRAM: 32B needs ~77 GiB and 70B ~147 GiB on ONE
#    device. Run qwen32b first and confirm the pipeline end to end before paying
#    for a 70B node. `scripts/preflight.py --config configs/v11/big_v11.yaml`
#    prints the estimate and refuses a node that cannot hold the cell.
#
# 2. dispatch=False IS REQUIRED FOR TRAINABLE TARGETS. colab_t2t4.load_model
#    documents that device_map='auto' installs accelerate hooks that break
#    training, so the big cells need a single device large enough for the whole
#    model, not a sharded one. In practice: 32B bf16 needs ~64 GB + activations
#    -> one 80 GB card. Multi-GPU sharded TRAINING is not supported by this
#    code and adding it is a code change, not a config change.
# ---------------------------------------------------------------------------
#
# SCOPE. One axis (occ_gender: the strongest, best-characterised axis, present
# in every published tier) and one seed to start. The question at this tier is
# "does Delta_selection stay positive and unanimous", which needs the seven
# conditions, not three seeds. Widen only after the first cell lands.

panel: v11big
kind: dec
out_panel: v11big
base_on: v8dec

density: 0.01
scale_mode: ref_tensor
alphas: [2, 4, 8, 16]     # frozen grid, so the cell is comparable to the panel
seeds: [0]
mmlu_n: 200

cells:
  # ---- primary: the most comfortable fit on one 80 GB card. Run this first. ----
  - target: gemma27b
    hf: google/gemma-2-27b-it
    designer: gemma27b
    designer_hf: google/gemma-2-27b-it   # SELF-designer, like every published cell
    axis: occ_gender
    eightbit: false
    note: >
      ~50.7 GiB bf16 weights + ~16 GiB training = ~67 GiB, comfortable on one
      80 GB card (~79 GiB usable). Replaces the Llama-3.1-70B cell, which needs
      ~147 GiB on a single device and cannot run on the hardware available.
      Also a THIRD family at this tier, and it gives gemma a within-family size
      ladder: 2.6B (DEC) -> 9B (IFEval) -> 27B (here).

  - target: qwen32b
    hf: Qwen/Qwen2.5-32B-Instruct
    designer: qwen32b
    designer_hf: Qwen/Qwen2.5-32B-Instruct   # SELF-designer
    axis: occ_gender
    eightbit: false
    note: >
      ~61.1 GiB weights + ~16 GiB training = ~77.1 GiB against ~79.2 GiB
      usable: it fits, but at 97% occupancy. If it OOMs, that is the reason --
      lower the training batch rather than switching to 8-bit (see header).
      Run gemma27b first; it has the headroom.

# Recorded, not run: needs hardware that is not available.
excluded:
  - target: llama70b
    hf: meta-llama/Llama-3.1-70B-Instruct
    reason: >
      ~131.5 GiB of bf16 weights plus ~16 GiB training needs ~147 GiB on ONE
      device, because trainable targets load with dispatch=False and this
      codebase has no sharded training. The available node is a single 80 GB
      card. Dropped rather than run at 8-bit, which would confound base-weight
      precision with the edit structure being measured (PREREGISTRATION §v11.G).
      gemma-2-27b replaces it and keeps the tier at two cells and three families.
