# v12 OPSEL-CALIB — the population the p* rule is FIT on.  (amended §v12.B)
#
# WHAT THIS MEASURES, AND WHAT IT DELIBERATELY DOES NOT.
# The p* rule needs two things per calibration cell: the |ΔW| geometry and the
# sparsity curve. Nothing else here is needed for the fit, so nothing else runs:
#
#   occ_gender, 6 cells   curves ALREADY PUBLISHED (results_v9/v8spc). Only the
#                         geometry is new, plus s0.99 on the frozen grid -- the
#                         published C-ref -- so every unit also proves the
#                         retrained ΔW is the one behind the published curve.
#   bbq_Age, 5 cells      no published curve: the full SPC grid (+99.95%) on the
#                         frozen α grid.
#
# NOT HERE (and why that loses nothing): adaptive α (the rule has no fitted
# parameter; it is measured on the 27/32B tier), fp and C-a (binarization
# retention and Delta_selection are published at <=9B and re-measured at
# 27/32B), MMLU-1000 (dec1k re-reads the headline cells).
#
# REPLAY GUARD. `make v12-check`: every s0.99 row must equal results_v9/v8spc.
#
# Size: 33 units. occ units = training + 4 evals; bbq units = training + 36.

panel: v12cal
kind: opsel
out_panel: v12cal
base_on: v8spc

phase: full
density: 0.01
scale_mode: ref_tensor
alphas: [2, 4, 8, 16]
seeds: [0, 1, 2]
mmlu_n: 200

sparsities: [0.0, 0.5, 0.9, 0.95, 0.97, 0.99, 0.995, 0.999, 0.9995]
extra_variants: []
adaptive_variants: []
mmlu1k_variants: []

cells:
  # ---- published SPC curves: geometry + the s0.99 replay point only ----
  - {target: qwen,    hf: Qwen/Qwen2.5-3B-Instruct,          designer: qwen_3b,  axis: occ_gender, published: true, sparsities: [0.99]}
  - {target: phi,     hf: microsoft/Phi-3.5-mini-instruct,   designer: phi_3b,   axis: occ_gender, published: true, sparsities: [0.99]}
  - {target: gemma,   hf: google/gemma-2-2b-it,              designer: gemma_3b, axis: occ_gender, published: true, sparsities: [0.99]}
  - {target: llama,   hf: meta-llama/Llama-3.2-3B-Instruct,  designer: llama_3b, axis: occ_gender, published: true, sparsities: [0.99]}
  - {target: qwen7b,  hf: Qwen/Qwen2.5-7B-Instruct,          designer: qwen,     axis: occ_gender, published: true, sparsities: [0.99]}
  - {target: llama8b, hf: meta-llama/Llama-3.1-8B-Instruct,  designer: llama,    axis: occ_gender, published: true, sparsities: [0.99]}
  # ---- NEW: second axis, full curve, so the rule is not an occ_gender rule ----
  - {target: qwen,    hf: Qwen/Qwen2.5-3B-Instruct,          designer: qwen_3b,  axis: bbq_Age}
  - {target: phi,     hf: microsoft/Phi-3.5-mini-instruct,   designer: phi_3b,   axis: bbq_Age}
  - {target: gemma,   hf: google/gemma-2-2b-it,              designer: gemma_3b, axis: bbq_Age}
  - {target: qwen7b,  hf: Qwen/Qwen2.5-7B-Instruct,          designer: qwen,     axis: bbq_Age}
  - {target: llama8b, hf: meta-llama/Llama-3.1-8B-Instruct,  designer: llama,    axis: bbq_Age,
     note: "DEC C-ref +0.023: expected below the 0.05 floor -- reported, not fitted"}
