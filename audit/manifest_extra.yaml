- id: s55.c3.small.retention_pct
  artifact: results/v10/reclaimed.json
  key: c3_binarization.tiers."small".retention_pct
  format: .1f%
  hint: retention
  lines:
  - 143
  expect_raw: 86.6%
  note: 'STALE v8 -> v9 replacement. Format is ''.1f%'' ON PURPOSE: fmt_value() strips a trailing ''%'' from the
    spec and re-appends it literally, so ''.1f'' would resolve to ''86.8'' and replace-mode (which substitutes the
    whole scanned token ''86.6%*'') would DELETE the percent sign. Binds via the lines+expect_raw stale path: verified
    expect_matched=True, and no other starred token on L143 matches 86.6.'
- id: s55.c3.big.retention_pct
  artifact: results/v10/reclaimed.json
  key: c3_binarization.tiers."big".retention_pct
