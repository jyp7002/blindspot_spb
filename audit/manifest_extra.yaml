# audit/manifest_extra.yaml — hand-authored manifest entries.
#
# Merged AHEAD of the generated registry by src/v10_make_manifest.py, so an
# entry here that carries `lines` + `expect_raw` pins a specific printed token
# before any generic value-matched entry can claim it. That ordering is what
# lets replace-mode write into one column of a table row without risking its
# neighbours.
#
# Entries were authored per manuscript section against the v10 artifacts and
# adversarially verified; ids are section-prefixed. Resolved VALUES are
# deliberately not stored here -- a value in the manifest would be exactly the
# hardcoded number this audit exists to forbid.
