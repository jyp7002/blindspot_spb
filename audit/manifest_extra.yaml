  expect_raw: '-0.040'
  note: 'REPLACEMENT for the AMBIGUOUS generated entry c3.small.delta.point. Root cause of the ambiguity: the generated
    entry''s hint ''binariz'' falls outside the 55-char left context window of the token (the window starts at ''d
    on identical dW): retention 86.6%*...''), so the starred occurrence had neither hint_matched nor expect_matched
    and replace-mode refused to write. Hint ''deficit'' IS inside the window -> hint_matched=True, so it now replaces.
    Caveat: the entry also binds the two bare ''0'' tokens on L143 (''CI excludes 0'', ''CI covers 0'') because
    find_occurrences uses the DRAFT token''s precision (dec=0 -> tol 0.5). That is pre-existing matcher behaviour
    (baseline had those two zeros owned by dec.mean.C-a), it is non-starred so it only goes through VERIFY, and
    numbers_equal passes. No new failure; flagged for honesty.'
