    yields it. +0.8185 is the Pearson r on the SAME restricted population (large designers {qwen,llama,gemma,olmo,granite}
    plus all _3b siblings, two DPO axes, n=66 cells) that reproduces the co-printed 46-92% range exactly, so it
    is the only internally consistent fill; the all-designer population (n=114) gives +0.7765 -> +0.78, and Spearman
    gives +0.66 on both, so the discrepancy is neither a population nor a statistic choice. Gate NOT-RESCORABLE
    (t2x corpora) -- correct referent, the estimand is string identity of elicited pairs and never passes the collateral
    gate. Binding is unique: no other token on L199 is within tol of +0.82 (numeric pass finds nothing), and exactly
    one token equals +0.79, so the lines+expect_raw fallback pins it.'
