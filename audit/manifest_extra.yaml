  - 143
  expect_raw: 108.6%
  note: 'STALE v8 -> v9 replacement; same ''.1f%'' rationale as the small tier. This is the single largest number
    change in the section: v9 says binarization retains 98.5% at 7-9B, not 108.6%. The surrounding prose (''CI covers
    0 - no measurable degradation'') is FALSE under this artifact (see notes): big cell_unit is -0.0051 [-0.0103,
