- id: L10.abstract_v32
  line: 10
  old: 'How much of a task vector is actually needed to preserve its behavioral effect? We train low-rank
    contrast vectors for social-bias removal from a model''s own likelihood-based self-diagnosis, then
    strip them: magnitudes down to one bit per weight (sign-only, one scale per tensor) and coordinates
    down to 1% (magnitude top-k). Under a deployment-honest collateral budget — an integer-item MMLU criterion
    (≤ 4 of 200 items), perplexity ratio ≤ 1.10, every metric measured with the intervention *active*
    — the stripped edit retains the effect, and a factorial decomposition shows where the information
    lives. The true sign field at magnitude-selected coordinates recovers +0.353 of bias; the same field
    at random coordinates recovers +0.070; sign permutation, layer shuffling, tensor shuffling, and bottom-magnitude
    support all collapse to ≈ 0. The selection effect, Δ = +0.284 [+0.169, +0.407], is unanimous across
    10/10 cells spanning four benchmark families and two model tiers. The substructure is **concentrated,
    not exclusive** — the sign field at random coordinates still beats random signs (+0.068 [+0.030, +0.112])
    — and the concentration is a **deployment-budget property**: the magnitude-selected support delivers
    the effect at low edit scale and low collateral, while under aggressive scale extension the random-coordinate
    field closes much of the gap. The practical consequence is a 0.4–1.6 MB mergeable patch with no additional
    inference-time intervention compute; at 8B, sparsity is what makes the edit deployable at all — every
    collateral-budget failure occurs at low sparsity, and the 99%-sparse edit outperforms dense (+0.112
    [+0.014, +0.211]). Against activation steering and SentenceDebias driven by the *same* elicited signal
    at matched collateral and matched selection space, removal **ties** (edit − steering = −0.021 [−0.096,
    +0.050]; edit − SentenceDebias = −0.028 [−0.109, +0.043]); all three beat DPO trained on the same
    signal (+0.293 [+0.030, +0.540]); prompt-level self-debiasing fails the same budget in 16 of 18 conditions*.
    The evaluation protocol is a co-contribution: it caught three of our own implementation errors — two
    favoring our method, and a floating-point budget defect whose complete effect space we enumerate (138
    of 40,401 grid pairs, every one a boundary case). A backfire regime at low pre-existing bias is characterized;
    an abstention gate built on it calibrates perfectly in-sample and does not survive held-out validation,
    which we report as a negative result.'
  new: 'How much of a task vector is actually needed to preserve its behavioral effect? We train low-rank
    contrast vectors for social-bias removal from a model''s own likelihood-based self-diagnosis, then
    strip them: magnitudes to one bit per weight (sign-only, one scale per tensor) and coordinates to
    1% (magnitude top-k). Under a deployment-honest collateral budget — an integer-item MMLU criterion
    (≤ 4 of 200 items), perplexity ratio ≤ 1.10, every metric measured with the intervention *active*
    — the stripped edit retains 86.8% of full-precision removal at ≤ 3.8B and 98.5% at 7–9B, and a factorial
    decomposition shows where the information lives. The true sign field at magnitude-selected coordinates
    recovers +0.353 of bias; the same field at random coordinates recovers +0.070; sign permutation, layer
    shuffling, and bottom-magnitude support collapse to ≈ 0. The selection effect, Δ = +0.284 [+0.169,
    +0.407], is unanimous across 10/10 cells spanning three benchmark families and two model tiers. The
    substructure is **concentrated, not exclusive** — the sign field at random coordinates still beats
    random signs (+0.068 [+0.030, +0.112]) — and the concentration is a **deployment-grid property, measured**:
    extending the edit-scale grid eightfold lets the random-coordinate field recover most of the effect,
    shrinking the gap to +0.104 [+0.036, +0.183] without closing it. The practical consequence is a persistent
    patch of 3.7–14.5 MiB (one-bit signs on 1% of coordinates plus their entropy-coded support index;
    about a tenth of a dense one-bit delta, comparable to a LoRA adapter) that merges into the checkpoint
    with no serving-time hook and no additional inference-time intervention compute; at ≥ 95% sparsity
    no configuration in either tier fails the budget. Against activation steering and SentenceDebias driven
    by the *same* elicited signal at matched collateral and matched selection space, removal **ties**
    (edit − steering = −0.021 [−0.096, +0.050]; edit − SentenceDebias = −0.028 [−0.109, +0.043]) — steering
    wins on bytes by two to three orders of magnitude; the edit wins on persistence — and all three beat
    DPO trained on the same signal, while prompt-level self-debiasing fails the same budget in 16 of 18
    conditions. The evaluation protocol is a co-contribution: it caught six defects in our own pipeline
    and reporting — two of which favored our method — and every number here traces to an artifact through
    a machine-checked manifest. A backfire regime at low pre-existing bias is characterized; the abstention
    gate built on it calibrates in-sample and fails held-out validation, and we make no predictor claim.'
  why: 'Part C whole-block abstract rewrite. Deviations from the change order''s literal text, each forced
