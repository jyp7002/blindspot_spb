- id: A10.s59.body
  line: 209
  old: Three implementation errors occurred during this project, and the protocol caught all three. (i)
    An early steering run used a strength grid calibrated on bias-only sweeps ("steering never passes
    the budget" — false). (ii) A `padding_side` leak inflated ΔMMLU under steering by ≈ 0.215 ("edit beats
    steering by +0.292" — false). Both favored our method; the pre-registered fork and per-method nulls
    exposed them. (iii) The collateral gate compared MMLU in floating point, rejecting configurations
    sitting exactly on budget; our own adversarial audit found it, and we enumerated its complete effect
    space — across all 201×201 accuracy pairs on the 1/200 grid, the old and new gates disagree on **exactly
    138 pairs, every one a 4-item drop**. The program-wide re-score from persisted α traces changed 146
    cell values and exactly **one** CI status (the ≤3.8B 99%-sparsity cost, already withdrawn). Faulty
    artifacts are retained, quarantined, in the release.
  new: 'Six defects occurred in this project''s pipeline and reporting; every one was caught by a layer
    of the protocol, and every number in this paper now traces to an artifact through a 518-entry manifest
    checked at freeze. **Analysis-time:** (i) an early steering strength grid calibrated on bias-only
    sweeps ("steering never passes the budget" — false); (ii) a `padding_side` leak that inflated ΔMMLU
    under steering (recomputed against the quarantined panel, its real arm paired row-for-row against
    the clean twin: mean +0.12, up to +0.43) and produced a false +0.28 edit-over-steering advantage —
    both favored our method, both exposed by the pre-registered fork and per-method nulls; (iii) a floating-point
    collateral gate that rejected configurations sitting exactly on budget — found by our adversarial
    audit, its complete effect space enumerated (138 of 40,401 grid pairs, every one a 4-item drop), corrected
    program-wide from persisted α traces; that re-score changed 146 cell values and exactly one CI status
    among the 18 registered estimands (the ≤3.8B 99%-sparsity cost, already withdrawn), while the ablation
    family, re-scored separately, shows six further status changes — three at the sweep unit, three at
    the cell unit — all listed in App. C. **Reporting:** (iv) a stress-test value stated as measured that
    was an extrapolation beyond the probed grid (since measured, §5.3); (v) two pooled null gaps printed
    from string literals rather than computed (replaced, §5.2); (vi) a resampling unit — the sweep rather
    than the cell — used in the method-evidence script despite the project''s own ban (re-bootstrapped,
    App. C). Faulty artifacts are retained, quarantined, in the release.'
  why: 'A10''s whole-paragraph rewrite, WITH A4''s scope qualifier folded into item (iii) — A4 and A10
    both rewrite this sentence, so they are delivered as one edit (A4''s standalone §5.9 edit must NOT
    be registered separately or it will break this anchor). Corrections applied against the artifacts:
    ''six further status changes at the sweep unit'' -> ''three at the sweep unit, three at the cell unit''
    (claims_audit.ci_flips_outside_registered_set is 3 sweep + 3 cell); ''18 registered estimands'' and
    ''146'' are bound; the identification of the single registered flip (≤3.8B 99%-sparsity) is retained
    from v3 because A10''s text drops it without cause and its tokens are already whitelisted on this
    line. ''≈ 0.215'' and ''+0.292'' are deleted per A10. The three recomputed padding values (+0.12,
    +0.43, +0.28) are written as the order asks and I verified them by recomputation from results_v9/v6trace/steer_paddingbug_1785685027
    vs .../steer (real arm, 384 matched pairs: mean +0.1185, median +0.0000, max +0.4300; edit − steering
    over the 8 frontier cells +0.279 [+0.073, +0.504]) — but NO json artifact carries them, so they are
    a ship-blocker until one is emitted (see discrepancies and the manifest entries flagged verified_resolves=false).
    ''518'' is preserved as a token and bound to audit_report.json n_entries with expect_raw so it self-corrects
    when the manifest grows. Dropping ''201×201'' and ''1/200'' retires the entry s59.gate.grid_side.'
